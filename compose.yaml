
name: ride-sharing

services:
  postgres:
    image: postgres:17
    container_name: ride_sharing-postgres

    environment:
      POSTGRES_DB: ride_sharing
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ride_sharing"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
